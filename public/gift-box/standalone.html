<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #fff5f5 0%, #fce4ec 30%, #fff0f0 60%, #fdf2f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Georgia', serif;
      overflow: hidden;
    }

    /* ===== GIFT BOX ===== */
    .gift-box {
      position: relative;
      width: 520px;
      height: 660px;
      background: linear-gradient(170deg, #fff9f5 0%, #fff0eb 40%, #fce8e4 100%);
      border-radius: 24px;
      box-shadow:
        0 20px 60px rgba(180,120,120,0.15),
        0 8px 25px rgba(180,120,120,0.1),
        inset 0 1px 0 rgba(255,255,255,0.8),
        inset 0 -2px 6px rgba(200,150,150,0.08);
      border: 1px solid rgba(220,180,175,0.4);
      overflow: hidden;
    }

    .gift-box::before {
      content: '';
      position: absolute;
      top: 45%;
      left: 50%;
      width: 300px;
      height: 300px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(0,200,200,0.06) 0%, transparent 70%);
      animation: innerGlow 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes innerGlow {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }

    /* ===== RIBBON & BOW ===== */
    .ribbon-v {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 28px;
      height: 100%;
      background: linear-gradient(90deg, rgba(200,160,140,0.15), rgba(200,160,140,0.25), rgba(200,160,140,0.15));
      pointer-events: none;
      z-index: 1;
    }
    .ribbon-h {
      position: absolute;
      top: 80px; left: 0;
      width: 100%;
      height: 28px;
      background: linear-gradient(180deg, rgba(200,160,140,0.15), rgba(200,160,140,0.25), rgba(200,160,140,0.15));
      pointer-events: none;
      z-index: 1;
    }
    .bow {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      filter: drop-shadow(0 2px 4px rgba(180,130,130,0.2));
    }
    .bow-loop {
      position: absolute;
      width: 36px;
      height: 22px;
      border: 3px solid #d4a093;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(212,160,147,0.2), rgba(212,160,147,0.05));
    }
    .bow-loop.left { left: -38px; top: -8px; transform: rotate(-25deg); }
    .bow-loop.right { left: 6px; top: -8px; transform: rotate(25deg); }
    .bow-knot {
      width: 12px;
      height: 12px;
      background: #d4a093;
      border-radius: 50%;
      position: relative;
      left: -3px;
      top: -2px;
    }
    .bow-tail {
      position: absolute;
      width: 3px;
      height: 20px;
      background: linear-gradient(to bottom, #d4a093, rgba(212,160,147,0.3));
      border-radius: 0 0 2px 2px;
    }
    .bow-tail.left { left: -8px; top: 6px; transform: rotate(15deg); }
    .bow-tail.right { left: 9px; top: 6px; transform: rotate(-15deg); }

    /* ===== TITLE ===== */
    .gift-title {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 3;
      animation: titleIn 1.5s ease-out forwards;
      opacity: 0;
      white-space: nowrap;
    }
    @keyframes titleIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(8px); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .gift-title h1 {
      font-family: 'Georgia', 'Segoe Script', serif;
      font-style: italic;
      font-size: 26px;
      font-weight: 400;
      background: linear-gradient(135deg, #c07a68, #e8b4a2, #c07a68, #a0624e);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: roseShimmer 3s ease-in-out infinite;
      letter-spacing: 1px;
    }
    @keyframes roseShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* ===== JEWELRY AREA ===== */
    .jewelry-area {
      position: absolute;
      top: 110px;
      left: 0;
      right: 0;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      padding: 0 25px;
    }

    /* ===== EXTRAS AREA (flower + kitkat) ===== */
    .extras-area {
      position: absolute;
      bottom: 60px;
      left: 0;
      right: 0;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      padding: 0 30px;
      z-index: 2;
    }

    /* ===== BANGLES ===== */
    .bangles-wrap {
      perspective: 600px;
      animation: bFloat 5s ease-in-out infinite;
    }
    @keyframes bFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .bangle-stack {
      position: relative;
      width: 140px;
      height: 200px;
      transform: rotateY(-12deg) rotateX(5deg);
      animation: bRotate 18s ease-in-out infinite;
    }
    @keyframes bRotate {
      0%, 100% { transform: rotateY(-12deg) rotateX(5deg); }
      50% { transform: rotateY(6deg) rotateX(-2deg); }
    }
    .bangle {
      position: absolute;
      border-radius: 50%;
      border: 4px solid;
    }
    .bangle.teal-dark {
      border-color: #007578;
      background: linear-gradient(135deg, rgba(0,80,82,0.55), rgba(0,50,52,0.7));
      box-shadow: 0 0 12px rgba(0,150,150,0.2), inset 0 0 8px rgba(0,200,200,0.15);
    }
    .bangle.teal-light {
      border-color: #00b0b3;
      background: linear-gradient(135deg, rgba(0,170,175,0.4), rgba(0,110,115,0.5));
      box-shadow: 0 0 14px rgba(0,200,200,0.25), inset 0 0 10px rgba(0,230,230,0.15);
    }
    .bangle.clear {
      border-color: rgba(180,160,155,0.45);
      background: linear-gradient(135deg, rgba(255,245,240,0.18), rgba(230,215,210,0.12));
      box-shadow: 0 0 8px rgba(200,180,170,0.15), inset 0 0 6px rgba(255,255,255,0.1);
    }
    .bangle-dot {
      position: absolute;
      width: 2.5px;
      height: 2.5px;
      border-radius: 50%;
      background: #d4a050;
      box-shadow: 0 0 4px #d4a050, 0 0 8px rgba(212,160,80,0.3);
      animation: dotGlow 2s ease-in-out infinite;
    }
    @keyframes dotGlow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    /* ===== JHUMKA EARRINGS ===== */
    .earrings-wrap {
      display: flex;
      gap: 20px;
      animation: eFloat 6s ease-in-out infinite 0.5s;
    }
    @keyframes eFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
    .earring {
      position: relative;
      width: 100px;
      transform-origin: top center;
      animation: eSwing 4s ease-in-out infinite;
      filter: drop-shadow(0 3px 8px rgba(140,100,90,0.15));
    }
    .earring:nth-child(2) { animation-delay: 0.3s; }
    @keyframes eSwing {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(2.5deg); }
    }
    .hook {
      width: 14px; height: 22px;
      border: 2.5px solid #b0a098;
      border-bottom: none;
      border-radius: 7px 7px 0 0;
      margin: 0 auto;
    }
    .hook::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #b8a8a0;
      transform: translateX(-50%);
    }
    .earring-circle {
      width: 88px; height: 88px;
      border-radius: 50%;
      border: 2.5px solid #b0a098;
      margin: 3px auto 0;
      position: relative;
      background: radial-gradient(circle, rgba(0,190,190,0.04) 0%, transparent 70%);
    }
    .inner-arc {
      position: absolute;
      border: 1.5px solid #b8a8a0;
      border-radius: 50%;
    }
    .inner-arc.left { width: 36px; height: 58px; top: 12px; left: 8px; border-right-color: transparent; transform: rotate(-10deg); }
    .inner-arc.right { width: 36px; height: 58px; top: 12px; right: 8px; border-left-color: transparent; transform: rotate(10deg); }
    .stone {
      position: absolute;
      background: linear-gradient(135deg, #00c8ca, #007a7c);
      animation: sGlow 3s ease-in-out infinite;
    }
    @keyframes sGlow {
      0%, 100% { box-shadow: 0 0 5px rgba(0,200,200,0.4), inset 0 1px 2px rgba(255,255,255,0.3); }
      50% { box-shadow: 0 0 12px rgba(0,200,200,0.7), 0 0 20px rgba(0,200,200,0.2), inset 0 1px 2px rgba(255,255,255,0.3); }
    }
    .stone.round { border-radius: 50%; width: 9px; height: 9px; }
    .stone.teardrop { width: 10px; height: 14px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
    .crown-points { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
    .crown-point { width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 6px solid #b0a098; }
    .jhumka-dome {
      width: 44px; height: 26px;
      margin: 2px auto 0;
      background: linear-gradient(180deg, #c8b8b0 0%, #a09088 40%, #b0a098 100%);
      border-radius: 50% 50% 4px 4px / 100% 100% 10% 10%;
      position: relative;
      box-shadow: 0 2px 8px rgba(100,70,60,0.15), inset 0 3px 6px rgba(255,255,255,0.2);
    }
    .jhumka-dome::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 4px; right: 4px;
      height: 3px;
      background: linear-gradient(90deg, #007a7c, #00c8ca, #007a7c);
      border-radius: 2px;
    }
    .beads-row { display: flex; justify-content: center; gap: 3px; margin-top: 1px; }
    .bead-strand {
      display: flex; flex-direction: column; align-items: center; gap: 1.5px;
      animation: bdSwing 2.5s ease-in-out infinite;
      transform-origin: top center;
    }
    @keyframes bdSwing { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
    .bead { width: 5px; height: 6px; border-radius: 50%; background: linear-gradient(135deg, #00d8da, #006e70); box-shadow: 0 0 3px rgba(0,200,200,0.4); }
    .bead.sm { width: 4px; height: 5px; }
    .bell { width: 6px; height: 7px; background: linear-gradient(180deg, #b0a098, #908078); border-radius: 0 0 50% 50%; }
    .side-beads { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1.5px; }
    .side-beads.left { bottom: 4px; left: 4px; }
    .side-beads.right { bottom: 4px; right: 4px; }

    /* ============================================
       ===== ROSE FLOWER =====
       ============================================ */
    .flower-wrap {
      position: relative;
      width: 120px;
      height: 160px;
      animation: flowerBob 4s ease-in-out infinite;
      filter: drop-shadow(0 4px 10px rgba(180,100,100,0.15));
    }
    @keyframes flowerBob {
      0%, 100% { transform: rotate(-3deg) translateY(0); }
      50% { transform: rotate(2deg) translateY(-5px); }
    }

    /* Stem */
    .stem {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 90px;
      background: linear-gradient(to bottom, #5a9a3a, #3d7a28);
      border-radius: 3px;
    }

    /* Leaves */
    .leaf {
      position: absolute;
      width: 30px;
      height: 16px;
      background: linear-gradient(135deg, #6ab44a, #3d8a28);
      border-radius: 0 50% 50% 0;
      box-shadow: inset -2px 0 4px rgba(0,0,0,0.1);
    }
    .leaf::after {
      content: '';
      position: absolute;
      top: 7px; left: 2px;
      width: 20px; height: 1px;
      background: rgba(255,255,255,0.3);
    }
    .leaf.left-leaf {
      bottom: 40px; left: 50%;
      transform: translateX(-100%) rotate(-20deg);
      border-radius: 50% 0 0 50%;
    }
    .leaf.left-leaf::after { left: auto; right: 2px; }
    .leaf.right-leaf {
      bottom: 55px; left: 50%;
      transform: rotate(15deg);
    }

    /* Flower head */
    .flower-head {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
    }

    /* Petals - outer ring */
    .petal-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .rose-petal {
      position: absolute;
      border-radius: 50% 50% 50% 50%;
      background: linear-gradient(135deg, #f7a0a8, #e8707a);
      box-shadow: inset 0 -3px 6px rgba(180,50,60,0.2), inset 0 3px 6px rgba(255,200,200,0.4);
    }

    /* Outer petals */
    .rose-petal.p1 { width: 34px; height: 30px; top: 2px; left: 23px; border-radius: 50% 50% 40% 40%; background: linear-gradient(180deg, #f5949e, #e06878); }
    .rose-petal.p2 { width: 30px; height: 32px; top: 18px; left: 2px; border-radius: 40% 50% 50% 40%; background: linear-gradient(135deg, #f29ca4, #dc606c); transform: rotate(-20deg); }
    .rose-petal.p3 { width: 30px; height: 32px; top: 18px; right: 2px; border-radius: 50% 40% 40% 50%; background: linear-gradient(225deg, #f09098, #d85868); transform: rotate(20deg); }
    .rose-petal.p4 { width: 34px; height: 28px; bottom: 8px; left: 10px; border-radius: 40% 40% 50% 50%; background: linear-gradient(0deg, #ee8890, #d45060); transform: rotate(10deg); }
    .rose-petal.p5 { width: 34px; height: 28px; bottom: 8px; right: 10px; border-radius: 40% 40% 50% 50%; background: linear-gradient(0deg, #ec8690, #d24e5e); transform: rotate(-10deg); }

    /* Inner petals - lighter/smaller */
    .rose-petal.inner1 { width: 24px; height: 22px; top: 16px; left: 20px; background: linear-gradient(135deg, #f8b0b8, #e87888); z-index: 1; border-radius: 50%; }
    .rose-petal.inner2 { width: 22px; height: 22px; top: 18px; left: 34px; background: linear-gradient(225deg, #f6aab4, #e47080); z-index: 1; border-radius: 50%; }
    .rose-petal.inner3 { width: 20px; height: 18px; top: 28px; left: 28px; background: linear-gradient(180deg, #fac0c8, #ea8898); z-index: 2; border-radius: 50%; }

    /* Center spiral */
    .rose-center {
      position: absolute;
      width: 14px; height: 14px;
      top: 28px; left: 33px;
      border-radius: 50%;
      background: radial-gradient(circle, #f8c8d0 20%, #e89098 60%, #d87080 100%);
      z-index: 3;
      box-shadow: 0 0 6px rgba(220,100,110,0.3);
    }
    .rose-center::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 8px; height: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255,200,200,0.5);
      border-bottom-color: transparent;
      border-right-color: transparent;
      transform: rotate(-45deg);
    }

    /* ============================================
       ===== KITKAT BAR =====
       ============================================ */
    .kitkat-wrap {
      position: relative;
      animation: kitkatBob 5s ease-in-out infinite 0.5s;
      filter: drop-shadow(0 4px 12px rgba(100,50,30,0.2));
    }
    @keyframes kitkatBob {
      0%, 100% { transform: rotate(2deg) translateY(0); }
      50% { transform: rotate(-1deg) translateY(-4px); }
    }

    .kitkat {
      position: relative;
      width: 110px;
      height: 150px;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Red wrapper */
    .kk-wrapper {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 65%;
      background: linear-gradient(180deg, #e82020 0%, #cc1818 50%, #b81515 100%);
      border-radius: 8px 8px 0 0;
      z-index: 1;
      box-shadow: inset 0 2px 4px rgba(255,100,100,0.3), inset 0 -2px 4px rgba(0,0,0,0.15);
    }

    /* KitKat logo area */
    .kk-logo {
      position: absolute;
      top: 8px; left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      text-align: center;
    }
    .kk-logo .kk-brand {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      opacity: 0.9;
    }
    .kk-logo .kk-name {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      line-height: 1;
    }
    .kk-logo .kk-oval {
      position: absolute;
      top: -2px; left: 50%;
      transform: translateX(-50%);
      width: 90px; height: 44px;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      pointer-events: none;
    }

    /* White wave separator */
    .kk-wave {
      position: absolute;
      top: 58%;
      left: -5%;
      width: 110%;
      height: 20px;
      background: #fff;
      z-index: 2;
      border-radius: 50% 50% 0 0;
    }

    /* Chocolate wafer fingers */
    .kk-fingers {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      height: 42%;
      display: flex;
      gap: 2px;
      padding: 8px 6px 6px;
      background: linear-gradient(180deg, #f5f0e8, #ede5d8);
      border-radius: 0 0 8px 8px;
      z-index: 1;
    }

    .kk-finger {
      flex: 1;
      background: linear-gradient(180deg, #8B5E3C 0%, #7B4F30 30%, #6E4528 60%, #8B5E3C 100%);
      border-radius: 3px;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(255,200,150,0.3), inset 0 -1px 2px rgba(0,0,0,0.2);
    }

    /* Wafer texture lines */
    .kk-finger::before {
      content: '';
      position: absolute;
      top: 20%; left: 15%; right: 15%;
      height: 1px;
      background: rgba(0,0,0,0.15);
      box-shadow: 0 8px 0 rgba(0,0,0,0.12), 0 16px 0 rgba(0,0,0,0.1), 0 24px 0 rgba(0,0,0,0.08);
    }

    /* Snap line between fingers */
    .kk-finger + .kk-finger::after {
      content: '';
      position: absolute;
      top: 10%; left: -2px;
      width: 2px;
      height: 80%;
      background: linear-gradient(to bottom,
        transparent 0%,
        rgba(90,50,20,0.4) 20%,
        rgba(90,50,20,0.6) 50%,
        rgba(90,50,20,0.4) 80%,
        transparent 100%
      );
    }

    /* Foil peek at top of fingers */
    .kk-foil {
      position: absolute;
      bottom: 42%; left: 0;
      width: 100%; height: 6px;
      background: linear-gradient(90deg,
        #d0d0d0, #e8e8e8 20%, #c8c8c8 40%, #e0e0e0 60%, #d0d0d0 80%, #e5e5e5
      );
      z-index: 2;
      opacity: 0.5;
    }

    /* ===== BOTTOM MESSAGE ===== */
    .gift-msg {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 3;
      animation: msgIn 1.5s ease-out 0.8s forwards;
      opacity: 0;
      white-space: nowrap;
    }
    @keyframes msgIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(6px); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .gift-msg p {
      font-size: 14px;
      color: #b08878;
      font-style: italic;
      letter-spacing: 1.5px;
    }
    .heart {
      display: inline-block;
      color: #e07070;
      animation: hBeat 1.5s ease-in-out infinite;
    }
    @keyframes hBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.3); }
      30% { transform: scale(1); }
      45% { transform: scale(1.2); }
      60% { transform: scale(1); }
    }

    /* ===== SPARKLE CANVAS ===== */
    .sparkle-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      border-radius: 24px;
    }

    /* ===== OUTER PETALS ===== */
    .bg-petal {
      position: absolute;
      width: 12px; height: 18px;
      border-radius: 50%;
      opacity: 0.15;
      animation: petalDrift 12s ease-in-out infinite;
    }
    @keyframes petalDrift {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.1; }
      50% { transform: translateY(-15px) rotate(45deg); opacity: 0.2; }
    }

    /* ===== DIVIDER LINE ===== */
    .divider {
      position: absolute;
      top: 410px;
      left: 40px;
      right: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200,160,150,0.3), transparent);
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- Scattered petals in background -->
  <div class="bg-petal" style="top:10%; left:8%; background:#e8b4a2; animation-delay:0s;"></div>
  <div class="bg-petal" style="top:70%; left:5%; background:#d4a093; animation-delay:2s;"></div>
  <div class="bg-petal" style="top:20%; right:10%; background:#c8948a; animation-delay:4s;"></div>
  <div class="bg-petal" style="top:80%; right:7%; background:#e8b4a2; animation-delay:1s;"></div>
  <div class="bg-petal" style="top:45%; left:3%; background:#d4a093; animation-delay:3s;"></div>

  <script>
    // ===== BANGLES =====
    const stack = document.getElementById('bangleStack');
    const types = [
      'teal-dark','clear','teal-light','clear','teal-dark',
      'teal-light','clear','teal-dark','clear','teal-light','teal-dark'
    ];
    types.forEach((t, i) => {
      const b = document.createElement('div');
      b.className = 'bangle ' + t;
      const s = 120 - i * 0.4;
      b.style.cssText = `width:${s}px;height:${s}px;left:${(140-s)/2}px;top:${i*16}px;`;
      if (t !== 'clear') {
        const n = 7 + Math.floor(Math.random() * 4);
        for (let d = 0; d < n; d++) {
          const dot = document.createElement('div');
          dot.className = 'bangle-dot';
          const a = (d / n) * 360, r = s / 2 - 4;
          dot.style.cssText = `left:${r + r*Math.cos(a*Math.PI/180)}px;top:${r + r*Math.sin(a*Math.PI/180)}px;animation-delay:${Math.random()*3}s;`;
          b.appendChild(dot);
        }
      }
      stack.appendChild(b);
    });

    // ===== SPARKLE PARTICLES =====
    const cvs = document.getElementById('sparkleCanvas');
    const box = document.getElementById('giftBox');
    const ctx = cvs.getContext('2d');

    function resize() {
      cvs.width = box.offsetWidth;
      cvs.height = box.offsetHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    let pts = [];
    const symbols = ['✦','✧','⋆','·'];

    function autoSparkle() {
      const x = 40 + Math.random() * (cvs.width - 80);
      const y = 100 + Math.random() * (cvs.height - 150);
      pts.push({
        x, y,
        vx: (Math.random() - 0.5) * 0.5,
        vy: -Math.random() * 0.8 - 0.3,
        life: 1,
        size: Math.random() * 8 + 4,
        char: symbols[Math.floor(Math.random() * symbols.length)],
        color: ['#d4a050','#00b8b8','#e0a0a0','#c0a898'][Math.floor(Math.random() * 4)]
      });
    }
    setInterval(autoSparkle, 350);

    box.addEventListener('mousemove', (e) => {
      const rect = box.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      for (let i = 0; i < 2; i++) {
        pts.push({
          x: mx + (Math.random() - 0.5) * 12,
          y: my + (Math.random() - 0.5) * 12,
          vx: (Math.random() - 0.5) * 1.5,
          vy: -Math.random() * 1.5 - 0.5,
          life: 1,
          size: Math.random() * 6 + 3,
          char: symbols[Math.floor(Math.random() * symbols.length)],
          color: ['#d4a050','#00b8b8','#e8b0b0'][Math.floor(Math.random() * 3)]
        });
      }
    });

    function draw() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      pts = pts.filter(p => p.life > 0);
      pts.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.012;
        ctx.globalAlpha = p.life * 0.8;
        ctx.font = `${p.size}px serif`;
        ctx.fillStyle = p.color;
        ctx.textAlign = 'center';
        ctx.fillText(p.char, p.x, p.y);
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }
    draw();

    setInterval(() => {
      const cx = 80 + Math.random() * (cvs.width - 160);
      const cy = 120 + Math.random() * (cvs.height - 200);
      for (let i = 0; i < 10; i++) {
        const a = (Math.PI * 2 / 10) * i;
        const sp = 0.5 + Math.random() * 1.5;
        pts.push({
          x: cx, y: cy,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 1,
          size: Math.random() * 6 + 3,
          char: '✦',
          color: ['#d4a050','#00b8b8','#e0a090'][Math.floor(Math.random() * 3)]
        });
      }
    }, 4000);
  </script>
